 const total=calcTotal(st);ui.totalCell.textContent=total===null?'—':fmt(total);ui.mt.innerHTML=`<b>Итого, SP</b>${total===null?'—':fmt(total)}`;
 for(const [qid,cell] of Object.entries(ui.qWeights))cell.textContent=st.answers[qid]??'';
 const key=st.type+'|'+st.sub;
 for(const sg of DATA.stages[key]||[]){
  const rowUI=ui.stageRows[sg.id];if(!rowUI)continue;
  const ss=st.stages[sg.id]||{};

 }
}

 const old=slotUI[i];if(old?.box)old.box.remove();slotUI[i]=null;

 if(!st.sub){compCell.textContent='—';totalCell.textContent='—';return}

 const sp=DATA.special[key];if(sp){const wrap=el('div','special');wrap.append(el('div','',sp.label));let inp;if(sp.number){inp=el('input');inp.type='number';inp.min='1';inp.placeholder='Введите количество'}else{inp=el('select');inp.append(option('','Выберите'));sp.choices.forEach(v=>inp.append(option(v)))}inp.value=st.special||'';const saveSpecial=()=>{st.special=inp.value;refreshSlot(i)};inp.onchange=saveSpecial;if(sp.number)inp.oninput=saveSpecial;wrap.append(inp);box.append(wrap)}
 box.append(el('div','section-title','2. Определение сложности'));const qwrap=el('div');box.append(qwrap);
 for(const qid of DATA.qmap[key]||[]){
  const q=DATA.questions[qid],row=el('div','question');row.append(el('div','',q.text));const sel=el('select');sel.append(option('','Выберите ответ'));q.answers.forEach(a=>sel.append(option(String(a.weight)+'|'+a.label,a.label)));
  if(st.answers[qid]!==undefined){const saved=String(st.answers[qid])+'|'+(st['answerLabel'+qid]||'');if([...sel.options].some(o=>o.value===saved))sel.value=saved}
  const weightCell=el('div','qweight',st.answers[qid]??'');ui.qWeights[qid]=weightCell;
  sel.onchange=()=>{if(!sel.value){delete st.answers[qid];delete st['answerLabel'+qid]}else{const p=sel.value.indexOf('|');st.answers[qid]=Number(sel.value.slice(0,p));st['answerLabel'+qid]=sel.value.slice(p+1)}refreshSlot(i)};
  row.append(sel);row.append(weightCell);qwrap.append(row)
 }
 box.append(el('div','section-title','3. Этапы'));const sh=el('div','stage-head');['Вкл.','Этап','Тип','Кол-во / слайды / респ.','Дни','Вариант','Ставка SP','Стоимость SP'].forEach(x=>sh.append(el('div','',x)));box.append(sh);
 const sw=el('div');box.append(sw);
 for(const sg of DATA.stages[key]||[]){
  const ss=st.stages[sg.id]||(st.stages[sg.id]={on:false,qty:'',days:'',option:''});const row=el('div','stage'+(ss.on?' on':''));
  const ch=el('input');ch.type='checkbox';ch.checked=ss.on;ch.onchange=()=>{ss.on=ch.checked;refreshSlot(i)};row.append(ch);
  const name=el('div','',sg.name);if(sg.note)name.append(el('div','note',sg.note));row.append(name);row.append(el('div','',sg.type));
  const q=el('div');if(sg.type==='Изменяемый'||sg.type==='Шаг 30 слайдов'||sg.type==='Дневниковый этап'){const inp=el('input');inp.type='number';inp.min='0';inp.value=ss.qty;inp.placeholder=sg.type==='Шаг 30 слайдов'?'Слайды':(sg.type==='Дневниковый этап'?'Респонденты':'Количество');inp.oninput=()=>{ss.qty=inp.value;refreshSlot(i)};q.append(inp)}row.append(q);

  const rateCell=el('div'),costCell=el('div');row.append(rateCell);row.append(costCell);ui.stageRows[sg.id]={row,rateCell,costCell};sw.append(row)

function resetAll(){
 const ticket=document.getElementById('ticketInput');if(ticket)ticket.value='';
 if(!confirm('Сбросить все выбранные услуги и введённые данные?'))return;
 for(let i=0;i<state.length;i++){
  state[i]=emptyState();
  if(slotUI[i]?.box)slotUI[i].box.remove();
  slotUI[i]=null;
  const r=refs[i];
  r.t.value='';
  r.s.innerHTML='';
  r.s.append(option('','Сначала тип'));
  r.cd.textContent='—';
  r.total.textContent='—';
 }
 document.querySelectorAll('.slot').forEach(x=>x.remove());
 window.scrollTo({top:0,behavior:'smooth'});
}

function selectedStageCost(st,sg,ss){
 if(!ss||!ss.on)return null;
 const c=getComplexity(st),mult=getMult(st);
 if(c.idx===null||mult===null)return null;
 const r=rate(sg,c.idx,ss.option);
 if(r===null)return null;
 if(sg.type==='Изменяемый'){
  if(ss.qty==='')return null; const q=Number(ss.qty); if(!(q>=0))return null; return q*r*mult;
 }
 if(sg.type==='Дневниковый этап'){
  const q=Number(ss.qty),d=Number(ss.days); if(!(q>0)||!(d>0))return null; return q*r*d*mult;
 }
 if(sg.type==='Шаг 30 слайдов'){
  const q=Number(ss.qty); if(!(q>0))return null; return Math.ceil(q/30)*r*mult;
 }
 if(sg.type==='Выбор')return r;
 return r*mult;
}

function validatePdfData(){
 const chosen=state.map((st,i)=>({st,i})).filter(x=>x.st.sub);
 if(!chosen.length){alert('Сначала выберите хотя бы одну подуслугу.');return null}
 for(const item of chosen){
  const c=getComplexity(item.st);
  if(c.idx===null){alert(`Заполните все вопросы сложности для услуги ${item.i+1}: ${item.st.sub}.`);return null}
  if(getMult(item.st)===null){alert(`Заполните дополнительный параметр для услуги ${item.i+1}: ${item.st.sub}.`);return null}
  const key=item.st.type+'|'+item.st.sub;
  for(const sg of DATA.stages[key]||[]){
   const ss=item.st.stages[sg.id]||{};
   if(!ss.on)continue;
   if(selectedStageCost(item.st,sg,ss)===null){alert(`Заполните параметры выбранного этапа «${sg.name}» в услуге ${item.i+1}.`);return null}
  }
 }
 return chosen;
}

function wrapCanvasText(ctx,text,maxWidth){
 const raw=String(text??'').replace(/\s+/g,' ').trim();
 if(!raw)return [''];
 const words=raw.split(' '),lines=[];let line='';
 for(const word of words){
  const test=line?line+' '+word:word;
  if(ctx.measureText(test).width<=maxWidth||!line)line=test;
  else{lines.push(line);line=word}
 }
 if(line)lines.push(line);return lines;
}

function reportOptionCoefficient(sg,ss){
 if(!(sg.opt==='OPT_REPORT_TURNKEY'||sg.opt==='OPT_REPORT_STANDALONE'))return 1;
 const v=String(ss?.option||'');
 if(v.startsWith('60 '))return 1.2;
 if(v.startsWith('90 ')||v.startsWith('120 '))return 1.4;
 return 1;
}

function stageCoefficientInfo(st,sg,ss){
 const key=st.type+'|'+st.sub,sp=DATA.special[key];
 let coefficient=1;const reasons=[];
 const rc=reportOptionCoefficient(sg,ss);
 if(rc>1){coefficient*=rc;reasons.push(`объём отчёта: ${ss.option}`)}
 if(sg.type!=='Выбор'&&sp&&!sp.number){
  const sm=sp.mult[st.special]??1;
  if(sm>1){coefficient*=sm;reasons.push(`${sp.label}: ${st.special}`)}
 }
 if(coefficient<=1)return null;
 const coefText=(Math.round(coefficient*1000)/1000).toLocaleString('ru-RU',{maximumFractionDigits:3});
 return {coefficient,coefText,reasons,comment:`Применён коэффициент ×${coefText} — ${reasons.join('; ')}`};
}

function createReportCanvases(chosen){
 const W=1240,H=1754,M=82,BOTTOM=92;const pages=[];let canvas,ctx,y;
 function page(){
  canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);y=M;pages.push(canvas);
 }
 function ensure(h){if(y+h>H-BOTTOM)page()}
 function line(text,size=22,bold=false,color='#1f2937',indent=0,gap=10,maxWidth=W-2*M-indent){
  ctx.font=`${bold?'700':'400'} ${size}px Arial, sans-serif`;ctx.fillStyle=color;ctx.textBaseline='top';const lines=wrapCanvasText(ctx,text,maxWidth);const lh=Math.round(size*1.35);ensure(lines.length*lh+gap);for(const l of lines){ctx.fillText(l,M+indent,y);y+=lh}y+=gap;
 }
 function divider(){ensure(24);ctx.strokeStyle='#d9e1f2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(M,y+5);ctx.lineTo(W-M,y+5);ctx.stroke();y+=24}
 page();
 line('Оценка проекта',34,true,'#17365d',0,6);
 line('Статичная оценка выбранных услуг и этапов',18,false,'#667085',0,6);
 line('Сформировано: '+new Date().toLocaleString('ru-RU'),16,false,'#667085',0,22);
 chosen.forEach((item,pos)=>{
  const st=item.st,key=st.type+'|'+st.sub,c=getComplexity(st),total=calcTotal(st);
  if(pos>0)divider();
  line(`Услуга ${item.i+1}: ${st.type} — ${st.sub}`,26,true,'#17365d',0,8);
  line(`Сложность: ${c.label} · Итого по услуге: ${fmt(total)} SP`,21,true,'#1f2937',0,14);
  const sp=DATA.special[key];
  if(sp&&st.special)line(`${sp.label}: ${st.special}`,17,false,'#475467',0,12);
  line('Выбранные этапы',20,true,'#1f2937',0,8);
  const selected=(DATA.stages[key]||[]).filter(sg=>(st.stages[sg.id]||{}).on);
  if(!selected.length)line('Этапы не выбраны.',17,false,'#667085',18,8);
  const coefficientNotes=[];
  for(const sg of selected){
   const ss=st.stages[sg.id]||{},r=rate(sg,c.idx,ss.option),cost=selectedStageCost(st,sg,ss);let details=[];
   if(sg.type==='Изменяемый')details.push(`количество: ${ss.qty}`);
   if(sg.type==='Дневниковый этап'){details.push(`респонденты: ${ss.qty}`);details.push(`дни: ${ss.days}`)}
   if(sg.type==='Шаг 30 слайдов')details.push(`слайды: ${ss.qty}`);
   if(sg.type==='Выбор'&&ss.option)details.push(`вариант: ${ss.option}`);
   line('• '+sg.name,17,true,'#344054',18,2,W-2*M-18);
   if(details.length)line(details.join(' · '),16,false,'#667085',36,2,W-2*M-36);
   line(`Вес / ставка: ${fmt(r)} SP · Стоимость этапа: ${fmt(cost)} SP`,16,false,'#475467',36,6,W-2*M-36);
   const ci=stageCoefficientInfo(st,sg,ss);
   if(ci)coefficientNotes.push({stage:sg.name,coefText:ci.coefText,reasons:ci.reasons});
  }
  if(coefficientNotes.length){
   const grouped=new Map();
   for(const note of coefficientNotes){
    const key=note.coefText+'|'+note.reasons.join('; ');
    if(!grouped.has(key))grouped.set(key,{coefText:note.coefText,reasons:note.reasons,stages:[]});
    grouped.get(key).stages.push(note.stage);
   }
   line('Комментарий по коэффициентам',17,true,'#9a6700',18,4,W-2*M-18);
   for(const note of grouped.values()){
    const stageText=note.stages.length===1?`этап «${note.stages[0]}»`:`этапы «${note.stages.join('», «')}»`;
    line(`Применён коэффициент ×${note.coefText} к ${stageText}. Причина: ${note.reasons.join('; ')}.`,16,false,'#9a6700',36,6,W-2*M-36);
   }
  }
 });
 pages.forEach((p,idx)=>{const c=p.getContext('2d');c.font='16px Arial, sans-serif';c.fillStyle='#98a2b3';c.textBaseline='bottom';c.fillText(`Страница ${idx+1} из ${pages.length}`,M,H-34)});
 return pages;
}

function asciiBytes(s){return new TextEncoder().encode(s)}
function concatByteArrays(parts){let n=0;for(const p of parts)n+=p.length;const out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function dataUrlBytes(url){const b64=url.split(',')[1],bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}

function canvasesToPdf(canvases){
 const imgs=canvases.map(c=>dataUrlBytes(c.toDataURL('image/jpeg',0.9))),n=imgs.length,maxObj=2+n*3,objs=new Array(maxObj+1);
 const kids=[];for(let i=0;i<n;i++)kids.push(`${3+i*3} 0 R`);
 objs[1]=asciiBytes('<< /Type /Catalog /Pages 2 0 R >>');
 objs[2]=asciiBytes(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`);
 for(let i=0;i<n;i++){
  const pageNo=3+i*3,imgNo=pageNo+1,contentNo=pageNo+2,img=imgs[i],name=`Im${i+1}`;
  objs[pageNo]=asciiBytes(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /${name} ${imgNo} 0 R >> >> /Contents ${contentNo} 0 R >>`);
  objs[imgNo]=concatByteArrays([asciiBytes(`<< /Type /XObject /Subtype /Image /Width ${canvases[i].width} /Height ${canvases[i].height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`),img,asciiBytes('\nendstream')]);
  const stream=`q\n595.28 0 0 841.89 0 0 cm\n/${name} Do\nQ\n`,sb=asciiBytes(stream);
  objs[contentNo]=concatByteArrays([asciiBytes(`<< /Length ${sb.length} >>\nstream\n`),sb,asciiBytes('endstream')]);
 }
 const header=concatByteArrays([asciiBytes('%PDF-1.4\n%'),new Uint8Array([0xe2,0xe3,0xcf,0xd3]),asciiBytes('\n')]);
 const parts=[header],offsets=new Array(maxObj+1).fill(0);let pos=header.length;
 for(let i=1;i<=maxObj;i++){
  offsets[i]=pos;const obj=concatByteArrays([asciiBytes(`${i} 0 obj\n`),objs[i],asciiBytes('\nendobj\n')]);parts.push(obj);pos+=obj.length;
 }
 const xrefPos=pos;let xref=`xref\n0 ${maxObj+1}\n0000000000 65535 f \n`;
 for(let i=1;i<=maxObj;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
 const tail=`trailer\n<< /Size ${maxObj+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
 parts.push(asciiBytes(xref),asciiBytes(tail));return new Blob(parts,{type:'application/pdf'});
}


function downloadPdf(){
 const chosen=validatePdfData();if(!chosen)return;
 const canvases=createReportCanvases(chosen),blob=canvasesToPdf(canvases),url=URL.createObjectURL(blob),a=document.createElement('a');
 const rawTicket=(document.getElementById('ticketInput')?.value||'').trim();
 const safeTicket=rawTicket.replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').replace(/[. ]+$/g,'').slice(0,100);
 const fileName=safeTicket?`Оценка проекта (${safeTicket}).pdf`:'Оценка проекта.pdf';
 a.href=url;a.download=fileName;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
